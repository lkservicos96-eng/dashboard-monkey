<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0A">
<title>Login - Dashboard Financeiro</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0A0C0A;
  --card:#151815;
  --text:#F4F7F4;
  --text-2:#8C948D;
  --text-3:#5C655E;
  --accent:#2AE98D;
  --accent-dim:rgba(42,233,141,.13);
  --orange:#D97706;
  --red:#FF7A70;
  --radius:20px;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-disp:'Space Grotesk','Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-ui);
  color:var(--text);
  background:
    radial-gradient(900px 420px at 50% -160px, rgba(42,233,141,.06), transparent 70%),
    var(--bg);
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  -webkit-font-smoothing:antialiased;
}
.login-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--radius);
  padding:40px;
  max-width:520px;
  width:100%;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.logo{
  text-align:center;
  margin-bottom:32px;
}
.logo-text{
  font:600 13px var(--font-ui);
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-2);
  margin-bottom:20px;
}
.logo-text b{color:var(--orange);font-weight:700}

/* Mascote simplificado */
.mascot{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:24px;
}
.mascot svg{
  width:260px;
  height:auto;
  margin-bottom:10px;
}
.mascot-cap{
  font:700 9.5px var(--font-ui);
  letter-spacing:2.2px;
  text-transform:uppercase;
  color:var(--text-2);
}
.mascot-cap b{color:var(--orange)}

/* Animações do robô */
.robot-head{transform-box:fill-box;transform-origin:center;animation:robotBob 4.2s ease-in-out infinite}
.robot-eyes{transform-box:fill-box;transform-origin:center;animation:robotBlink 5.4s infinite}
@keyframes robotBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes robotBlink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

h1{
  font:600 20px var(--font-ui);
  color:var(--text);
  margin-bottom:8px;
  text-align:center;
}
.subtitle{
  font:500 13px var(--font-ui);
  color:var(--text-2);
  text-align:center;
  margin-bottom:28px;
}
.field{
  margin-bottom:18px;
}
label{
  display:block;
  font:600 12.5px var(--font-ui);
  color:var(--text-2);
  margin-bottom:8px;
}
input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:13px 15px;
  color:var(--text);
  font:500 14px var(--font-ui);
  outline:0;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{
  border-color:rgba(42,233,141,.5);
  box-shadow:0 0 0 3px var(--accent-dim);
}
.btn{
  width:100%;
  background:var(--orange);
  color:#1A0F04;
  border:0;
  border-radius:13px;
  padding:14px;
  font:700 15px var(--font-ui);
  cursor:pointer;
  margin-top:8px;
  transition:transform .15s,box-shadow .2s;
}
.btn:hover{box-shadow:0 8px 22px rgba(217,119,6,.4)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{
  margin-top:14px;
  color:var(--red);
  background:rgba(255,122,112,.1);
  border:1px solid rgba(255,122,112,.2);
  border-radius:10px;
  padding:11px 13px;
  font:500 12.5px var(--font-ui);
  display:none;
}
.error.show{display:block;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.footer{
  margin-top:24px;
  text-align:center;
  font:500 11.5px var(--font-ui);
  color:var(--text-3);
}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-text">DASHBOARD FINANCEIRO <b>MONKEY</b></div>

    <div class="mascot">
      <svg viewBox="0 0 320 262" role="img" aria-label="Robô MONKEY POKAS IDEIAS">
        <defs>
          <linearGradient id="mBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FCF8F1"/>
            <stop offset="1" stop-color="#E4DCCB"/>
          </linearGradient>
          <linearGradient id="mScreen" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0" stop-color="#FFF2DC"/>
            <stop offset="0.55" stop-color="#FFD9A8"/>
            <stop offset="1" stop-color="#E9963E"/>
          </linearGradient>
          <linearGradient id="mChest" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E8933F"/>
            <stop offset="1" stop-color="#BE6017"/>
          </linearGradient>
          <radialGradient id="mScreenGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFCE8A" stop-opacity=".55"/>
            <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- mesa -->
        <rect x="14" y="196" width="292" height="9" rx="4" fill="#3A3F36"/>
        <rect x="14" y="196" width="292" height="3" rx="1.5" fill="#4C5346" opacity=".7"/>

        <!-- pés do robô -->
        <rect x="126" y="212" width="30" height="13" rx="6" fill="#E4DCCB" stroke="#4A423A" stroke-width="1.6"/>
        <rect x="164" y="212" width="30" height="13" rx="6" fill="#E4DCCB" stroke="#4A423A" stroke-width="1.6"/>

        <!-- corpo -->
        <rect x="112" y="138" width="96" height="60" rx="13" fill="url(#mBody)" stroke="#4A423A" stroke-width="2"/>
        <rect x="125" y="150" width="70" height="37" rx="9" fill="url(#mChest)" stroke="#8A4410" stroke-width="1.4"/>
        <text x="160" y="172" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif"
              font-size="13" font-weight="700" letter-spacing="-.4" fill="#FFF6E8">BAND PKS</text>

        <!-- pescoço -->
        <rect x="146" y="128" width="28" height="12" rx="3" fill="#CFC5B2" stroke="#4A423A" stroke-width="1.6"/>

        <!-- braços -->
        <path d="M208 150 L232 168 L236 186" fill="none" stroke="#E4DCCB" stroke-width="11" stroke-linecap="round"/>
        <circle cx="237" cy="189" r="7.5" fill="#E8933F" stroke="#4A423A" stroke-width="1.6"/>
        <path d="M112 152 L92 170 L88 186" fill="none" stroke="#E4DCCB" stroke-width="11" stroke-linecap="round"/>
        <circle cx="87" cy="189" r="7.5" fill="#E8933F" stroke="#4A423A" stroke-width="1.6"/>

        <!-- cabeça -->
        <g class="robot-head">
          <rect x="92" y="54" width="136" height="78" rx="15" fill="url(#mBody)" stroke="#4A423A" stroke-width="2"/>
          <rect x="93.6" y="55.6" width="132.8" height="30" rx="13" fill="#FFFDF8" opacity=".55"/>

          <!-- tela / rosto -->
          <ellipse cx="160" cy="95" rx="66" ry="32" fill="url(#mScreenGlow)"/>
          <rect x="108" y="72" width="104" height="46" rx="22" fill="url(#mScreen)" stroke="#8A4410" stroke-width="1.6"/>
          <g class="robot-eyes">
            <ellipse cx="136" cy="95" rx="8.5" ry="11.5" fill="#C2661A" opacity=".92"/>
            <ellipse cx="184" cy="95" rx="8.5" ry="11.5" fill="#C2661A" opacity=".92"/>
            <ellipse cx="133.5" cy="90.5" rx="3" ry="4.2" fill="#FFF6E8" opacity=".95"/>
            <ellipse cx="181.5" cy="90.5" rx="3" ry="4.2" fill="#FFF6E8" opacity=".95"/>
          </g>

          <!-- antena -->
          <line x1="160" y1="54" x2="160" y2="40" stroke="#4A423A" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="160" cy="37" r="4.6" fill="#D97706" stroke="#8A4410" stroke-width="1.2"/>
        </g>
      </svg>
      <div class="mascot-cap">BAND POKAS IDEIAS <b>SYSTEM</b></div>
    </div>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" autocomplete="username" required autofocus>
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn" id="loginBtn">Entrar</button>
    <div class="error" id="error">Usuário ou senha incorretos</div>
  </form>

  <div class="footer">
    Sistema de controle financeiro • Acesso autorizado
  </div>
</div>

<script>
(function(){
'use strict';

// ========== CONFIGURAÇÃO DE ACESSO ==========
// Para gerar um novo hash de senha, abra o console do navegador e digite:
// await hashPassword("...")

const USERS = {
  'monkey': {
    passwordHash: '714e03a468b4af4cfa48ee99db3208db1a6159ba3be30551d40dfc51beaf4437'
  },
  'admin': {
    passwordHash: 'b8b8eb83374c0bf3b1c3224159f6119dbfff1b7ed6dfecdd80d4e8a895790a34'
  }
};

// ========== FIM DA CONFIGURAÇÃO ==========

async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

const form = document.getElementById('loginForm');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorEl = document.getElementById('error');

// Verifica se já está autenticado
const session = sessionStorage.getItem('auth_session');
if (session) {
  try {
    const data = JSON.parse(session);
    if (data.authenticated && data.expires > Date.now()) {
      window.location.href = 'index.html';
      return;
    }
  } catch(e) {}
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  errorEl.classList.remove('show');

  const username = usernameInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (!username || !password) {
    showError('Preencha todos os campos');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'Verificando...';

  try {
    const hash = await hashPassword(password);
    const user = USERS[username];

    if (user && user.passwordHash === hash) {
      // Login bem-sucedido
      const session = {
        authenticated: true,
        username: username,
        expires: Date.now() + (8 * 60 * 60 * 1000) // 8 horas
      };
      sessionStorage.setItem('auth_session', JSON.stringify(session));

      loginBtn.textContent = 'Sucesso!';
      setTimeout(function() {
        window.location.href = 'index.html';
      }, 300);
    } else {
      // Credenciais inválidas
      showError('Usuário ou senha incorretos');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
      passwordInput.value = '';
      passwordInput.focus();
    }
  } catch(err) {
    showError('Erro ao processar login');
    loginBtn.disabled = false;
    loginBtn.textContent = 'Entrar';
  }
});

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('show');
}

// Gera hashes para o console (helper para criar novos usuários)
window.hashPassword = hashPassword;

})();
</script>
</body>
</html>
